name: DshMobile
options:
  bundleIdPrefix: io.github.hyperion2144.dsh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  DshMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # 全部 Swift 源码：按目录同步，新增文件不用改工程。
      - path: DshMobile/Sources
      # 壳内引导脚本（整目录进包，保持 bundle 里的相对位置）。
      - path: DshMobile/Resources/shell
        type: folder
      # 移动变体产物（构建产物，不入库；由 tools/sync-web-dist.sh 同步）。
      - path: DshMobile/Resources/dist
        type: folder
      - path: DshMobile/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: DshMobile/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hyperion2144.dsh.plusm
        PRODUCT_NAME: DshMobile
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
