<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'">
    <title>新建 Profile</title>
    <link rel="stylesheet" href="profile-name.css">
  </head>
  <body>
    <main>
      <h1>新建 Profile</h1>
      <label for="name">名称（小写字母、数字、连字符）</label>
      <input id="name" autocomplete="off" spellcheck="false" aria-describedby="hint">
      <p id="hint">会在 $DSH_HOME/profiles 下建一份独立的 profile。</p>
      <p id="error" role="alert" hidden></p>
      <footer>
        <button id="cancel" type="button">取消</button>
        <button id="ok" type="button">创建</button>
      </footer>
    </main>
    <script src="profile-name.js"></script>
  </body>
</html>
