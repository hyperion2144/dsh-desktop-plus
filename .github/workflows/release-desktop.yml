name: Release Desktop

# Tag-driven release (ticket #29): a `v<X.Y.Z[-pre].plus.N>` tag is validated against the
# generated version (ticket #29 #4 — tags are never hand-edited past the generator), then
# the three-platform unsigned artifacts are packaged and published to a GitHub Release
# whose notes come from the CHANGELOG 未发布 section.
on:
  push:
    tags:
      - 'v*.plus.*'

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag against generated version
        run: node scripts/plus/version.mjs --check "${{ github.ref_name }}"

  package:
    needs: validate
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-14
          - target: win-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install

      - name: Resolve plus version
        id: plusversion
        shell: bash
        run: echo "version=$(node scripts/plus/version.mjs --print)" >> "$GITHUB_OUTPUT"

      - name: Build desktop shell
        working-directory: upstream
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          node ./node_modules/typescript/bin/tsc -b tsconfig.host.json
          pnpm exec tsdown --config-loader native --env.DSH_BUILD_FACE host
          pnpm --filter @deepseek-ai/dsh-desktop run bundle

      # 同上：插件客户端包不在仓库里，签名/打包前先在 CI 构建。
      - name: Build plus plugin client bundle
        run: pnpm --filter @deepseek-ai/dsh-desktop-plus-plugin run build:client

      - name: Build plus brand client bundle
        run: pnpm --filter @deepseek-ai/dsh-desktop-plus-brand run build:client

      - name: Install xvfb (Linux headless smoke)
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # CUA 原生构建需要 Swift 6；macOS 镜像默认 Xcode 15（Swift 5.10），先选最新 Xcode。
      - name: Select latest Xcode (Swift 6 for CUA native)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version | head -1
      # CUA（Computer Use）macOS 原生二进制是 gitignore 的构建产物，官方发布流在打包前现场编译；
      # 不先建出来，npm pack 的 files 白名单收不到 native/bin，装机后 cua 插件报 ENOENT。
      - name: Build CUA native helper (macOS)
        if: runner.os == 'macOS'
        working-directory: upstream/packages/experimental/cua-macos
        run: |
          swift build --package-path native --configuration release --product dsh-cua-native
          arch=$(uname -m | sed 's/x86_64/x64/')
          mkdir -p "native/bin/darwin-$arch"
          cp native/.build/release/dsh-cua-native "native/bin/darwin-$arch/dsh-cua-native"

      - name: Package ${{ matrix.target }} (unsigned — no signing secrets on this repo)
        working-directory: upstream/apps/desktop
        env:
          # 更新源：本仓库 GitHub Releases。plus 版本号必带 prerelease，渠道用 nightly
          # （latest 会被 electron-builder 的 stable-only 校验拒绝）；未签名构建现在也会写
          # app-update.yml（electron-builder-config.mjs 的 plus 默认 feed）。
          DSH_DESKTOP_UPDATE_PUBLIC_URL: https://github.com/hyperion2144/dsh-desktop-plus/releases/latest/download/
          DSH_DESKTOP_UPDATE_CHANNEL: nightly
        run: >
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm exec tsx scripts/package-target.ts ${{ matrix.target }} --unsigned --build-version ${{ steps.plusversion.outputs.version }}
          else
            pnpm exec tsx scripts/package-target.ts ${{ matrix.target }} --unsigned --build-version ${{ steps.plusversion.outputs.version }}
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # release 步骤只下载这个 artifact：只装安装包产物，诊断证据不上传。
          # packaging-runs 里的 targets 快照与真产物路径形状一致，混传必被通配扫入）。
          name: desktop-${{ matrix.target }}
          path: |
            upstream/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/**
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: false
      - name: Create GitHub release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          # download-artifact 对单一 path 按最短公共祖先裁剪：desktop-* 只有一条
          # path，产物在 artifacts/desktop-<t>/ 顶层平铺。
          # 只收顶层文件：unsigned-artifacts 下的 win-unpacked / mac-arm64 解包应用树
          # 里也有同名可执行与 yml，递归收集会把应用文件当成发布产物扫进来。
          find artifacts -maxdepth 2 -type f | head -40
          find artifacts -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.blockmap' -o -name 'nightly*.yml' -o -name 'latest*.yml' \) -exec cp {} release-assets/ \; || true
          {
            echo "## dsh-desktop-plus ${TAG}"
            echo
            echo "> 未签名构建：本仓库未配置 macOS 公证与 Windows 签名凭据。"
            echo
            node scripts/plus/notes.mjs >> release-notes.md 2>/dev/null || true
            [ -s release-notes.md ] || node --input-type=module -e "import { unreleasedNotes, releasedNotes } from './scripts/plus/version.mjs'; const tag = process.argv[1]; const n = unreleasedNotes() || releasedNotes(tag.replace(/^v/, '')); console.log(n === '' ? '_（CHANGELOG 无该版本的发布说明）_' : n)" "$TAG" >> release-notes.md
            cat release-notes.md
          } > combined-notes.md
          gh release create "$TAG" --title "dsh-desktop-plus $TAG" --notes-file combined-notes.md release-assets/*
