name: Release Desktop

# Tag-driven release (ticket #29): a `v<X.Y.Z[-pre].plus.N>` tag is validated against the
# generated version (ticket #29 #4 — tags are never hand-edited past the generator), then
# the three-platform unsigned artifacts are packaged and published to a GitHub Release
# whose notes come from the CHANGELOG 未发布 section.
on:
  push:
    tags:
      - 'v*.plus.*'

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # version.mjs --check 需要历史 tag 推导期望版本：浅克隆只能看到当前 tag，
          # plus.2 起期望版本会恒为 plus.1 而校验失败（#68）。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag against generated version
        run: node scripts/plus/version.mjs --check "${{ github.ref_name }}"

  # 构建链在 build-desktop.yml：与手动打包（package-desktop.yml）共用同一份步骤。
  # 以前两份各抄一遍，release 那份漏了 Typert 声明生成、上游 workspace 安装与 asar
  # 闭包门禁，macOS/Linux 打包在聚合 tsc 阶段报一片 "Cannot find module …/remote"。
  package:
    needs: validate
    uses: ./.github/workflows/build-desktop.yml
    with:
      update_feed: true

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: false
      - name: Publish the GitHub release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          # download-artifact 对单一 path 按最短公共祖先裁剪：desktop-* 只有一条
          # path，产物在 artifacts/desktop-<t>/ 顶层平铺。
          # 只收顶层文件：unsigned-artifacts 下的 win-unpacked / mac-arm64 解包应用树
          # 里也有同名可执行与 yml，递归收集会把应用文件当成发布产物扫进来。
          find artifacts -maxdepth 2 -type f | head -40
          find artifacts -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.blockmap' -o -name 'nightly*.yml' -o -name 'latest*.yml' \) -exec cp {} release-assets/ \; || true
          {
            echo "## dsh-desktop-plus ${TAG}"
            echo
            echo "> 未签名构建：本仓库未配置 macOS 公证与 Windows 签名凭据。"
            echo
            node scripts/plus/notes.mjs >> release-notes.md 2>/dev/null || true
            [ -s release-notes.md ] || node --input-type=module -e "import { unreleasedNotes, releasedNotes } from './scripts/plus/version.mjs'; const tag = process.argv[1]; const n = unreleasedNotes() || releasedNotes(tag.replace(/^v/, '')); console.log(n === '' ? '_（CHANGELOG 无该版本的发布说明）_' : n)" "$TAG" >> release-notes.md
            cat release-notes.md
          } > combined-notes.md
          # 重发（同一个 tag 重打一次）必须能覆盖已有 release：release 已存在时改为
          # 覆盖资产 + 改说明，而不是直接失败（之前重发一遍就卡在 create）。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在：覆盖资产与说明"
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file combined-notes.md --title "dsh-desktop-plus $TAG"
          else
            gh release create "$TAG" --title "dsh-desktop-plus $TAG" --notes-file combined-notes.md release-assets/*
          fi
          # 收口成已发布：draft release 的 releases/download/<tag>/<asset> 一律 404，
          # 移动端发版后的「更新链路校验」会因此挂掉（重发场景踩过），
          # 而 release 是否处于 draft 不应该靠调用方记得手动改。
          gh release edit "$TAG" --draft=false
