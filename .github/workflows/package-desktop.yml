name: Package Desktop

# Manual only. Packaging downloads an Electron runtime and a prepared DSH runtime per
# platform, which is far too heavy for pull requests and would race the check workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-14
          - target: win-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Package ${{ matrix.target }}
        working-directory: upstream/apps/desktop
        run: pnpm exec tsx scripts/package-target.ts ${{ matrix.target }} --unsigned

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            upstream/apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/**
            upstream/apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: warn
