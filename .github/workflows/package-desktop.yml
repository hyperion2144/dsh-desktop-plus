name: Package Desktop

# Manual only. Packaging downloads an Electron runtime and a prepared DSH runtime per
# platform, which is far too heavy for pull requests and would race the check workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-14
          - target: win-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build desktop shell
        working-directory: upstream
        # The official script caps Node at 4096MB, which a cold full build on CI
        # runners exceeds; run the same chain with a larger heap.
        run: |
          node --max-old-space-size=8192 ./node_modules/typescript/bin/tsc -b tsconfig.host.json
          pnpm exec tsdown --config-loader native --env.DSH_BUILD_FACE host
          pnpm --filter @deepseek-ai/dsh-desktop run bundle

      - name: Install xvfb (Linux headless smoke)
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Package ${{ matrix.target }}
        working-directory: upstream/apps/desktop
        # Linux runners have no display server; the packaged smoke launches the
        # Electron binary, so wrap it in xvfb. The conditional needs an explicit
        # bash shell: Windows runners default to PowerShell.
        run: >
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm exec tsx scripts/package-target.ts ${{ matrix.target }} --unsigned
          else
            pnpm exec tsx scripts/package-target.ts ${{ matrix.target }} --unsigned
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          # Upload the installers only: the unpacked app tree, builder-debug.yml and the
          # packaging-run logs are build intermediates, not deliverables.
          path: |
            upstream/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.dmg
            upstream/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.exe
            upstream/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.AppImage
            upstream/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.tar.gz
          if-no-files-found: error
